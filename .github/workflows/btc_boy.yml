name: BTC boy verisi (tek seferlik)
on:
  push:
    branches: [veri/btc_boy]
permissions:
  contents: write
jobs:
  indir:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet pandas requests numpy
      - run: python indir_btc.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add veri && git commit -m "veri: BTC boy verisi [skip ci]" && git push
