name: Trend 4h veri 38 coin (tek seferlik)
on:
  push:
    branches: [veri/trend4h]
permissions:
  contents: write
jobs:
  indir:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet pandas requests
      - run: python indir_4h.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add veri && git commit -m "veri: 4h + funding [skip ci]" && git push
